[package]
name = "todora"
version = "0.11.0"
edition = "2024"
description = "A 3rd-person arcade racer around forty scaled real circuits"
license = "MIT"
repository = "https://github.com/oliverlukschander/todora"

[workspace]
members = [".", "server"]

[features]
visual-check = []
game-center = []
multiplayer-test = []

[dependencies]
bevy = "0.19"
lyon_tessellation = "1.0.22"
# The engine's trigonometry, the same to the bit on every platform; see
# `car::physics::turn`.
libm = "0.2.16"
rodio = { version = "0.22.2", default-features = false, features = ["symphonia-mp3"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Online leaderboards: a key pair per player, requests signed with it.
ed25519-dalek = "2"
base64 = "0.22"
getrandom = "0.3"

[build-dependencies]
cc = "1"

# Playable debug builds: cheap crate code, optimized engine.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# What ships. Thin LTO buys a good deal of speed for a modest build-time cost;
# stripping symbols halves the binary.
[profile.release]
lto = "thin"
strip = true
