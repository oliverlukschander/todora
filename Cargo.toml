[package]
name = "todora"
version = "0.1.0"
edition = "2024"
description = "A 3rd-person arcade racer around a scaled Red Bull Ring"
license = "MIT"
repository = "https://github.com/oliverlukschander/todora"

[dependencies]
bevy = "0.19"

# Playable debug builds: cheap crate code, optimized engine.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# What ships. Thin LTO buys a good deal of speed for a modest build-time cost;
# stripping symbols halves the binary.
[profile.release]
lto = "thin"
strip = true
