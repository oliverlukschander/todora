[package]
name = "todora"
version = "0.10.0"
edition = "2024"
description = "A 3rd-person arcade racer around forty scaled real circuits"
license = "MIT"
repository = "https://github.com/oliverlukschander/todora"

[features]
visual-check = []

[dependencies]
bevy = "0.19"
lyon_tessellation = "1.0.22"
rodio = { version = "0.22.2", default-features = false, features = ["symphonia-mp3"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }

# Playable debug builds: cheap crate code, optimized engine.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# What ships. Thin LTO buys a good deal of speed for a modest build-time cost;
# stripping symbols halves the binary.
[profile.release]
lto = "thin"
strip = true
